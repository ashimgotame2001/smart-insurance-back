openapi: 3.0.3
info:
  title: SR Example API
  version: 1.0.0
  description: Smart Remittance example module API

servers:
  - url: /api/v1

paths:
  /remittances:
    get:
      operationId: listRemittances
      summary: List remittances
      description: "Requirement: REM-LIST-001"
      tags: [Remittances]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated remittance list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittancePageResponse'
    post:
      operationId: createRemittance
      summary: Create remittance
      x-requirement-id: REM-SEND-001
      tags: [Remittances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRemittanceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    CreateRemittanceRequest:
      type: object
      required: [customerId, beneficiaryId, amount, currency]
      properties:
        customerId:
          type: integer
          format: int64
        beneficiaryId:
          type: integer
          format: int64
        amount:
          type: number
        currency:
          type: string
          minLength: 3
          maxLength: 3
    RemittanceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
    RemittancePageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RemittanceResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    GlobalResponse:
      type: object
      properties:
        status:
          type: string
        code:
          type: string
        message:
          type: string
        data:
          type: object
          nullable: true
          description: Endpoint-specific success payload
          additionalProperties: true
        errorDetail:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        description:
          type: string
        causes:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCause'
    ErrorCause:
      type: object
      properties:
        type:
          type: string
          enum: [FIELD, OBJECT]
        details:
          type: array
          items:
            $ref: '#/components/schemas/CauseDetail'
    CauseDetail:
      type: object
      properties:
        entityName:
          type: string
        attributeName:
          type: string
          nullable: true
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Validation or business error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GlobalResponse'
