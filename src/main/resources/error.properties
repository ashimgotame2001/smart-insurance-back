AUTH-001=Authentication failed. Invalid username or email.
AUTH-002=Authentication failed. Invalid password.
AUTH-003=User account "{0}" is disabled. Contact your administrator.
AUTH-004=User account "{0}" is locked. Contact your administrator.
AUTH-005=Access denied. You do not have permission to perform this action.
AUTH-006=Session expired. Please login again.
AUTH-007=Invalid or expired refresh token. Please login again.
AUTH-008=Username "{0}" is already taken.
AUTH-009=Email "{0}" is already in use by another account.
AUTH-010=You must change your password before accessing the system.
AUTH-011=Login not allowed at this time. Your allowed login window is {0} to {1}.
AUTH-012=Login not allowed today. Your account is restricted to specific days of the week.
AUTH-013=Maximum concurrent sessions reached. Please logout from another device or contact your administrator.

